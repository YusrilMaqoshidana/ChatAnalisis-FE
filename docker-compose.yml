services:
  # ----------------------------------------------------
  # Frontend Service (Vue 3 + Vite)
  # ----------------------------------------------------
  frontend:
    build:
      context: .
      args:
        - VITE_API_BASE_URL=/
      network: host
    container_name: chatanalisis-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
    networks:
      chatanalisis-network:
        aliases:
          - frontend
          - chatanalisis-frontend
      proxy-net:
        aliases:
          - chatanalisis-fe
          - chatanalisis-frontend

networks:
  chatanalisis-network:
    name: chatanalisis-network
  proxy-net:
    external: true

# ==============================================================================
# DOKUMENTASI & PANDUAN PENGGUNAAN (FRONTEND DOCKER COMPOSE)
# ==============================================================================
# CARA MENJALANKAN:
# 1. Network 'chatanalisis-network' akan dibuat atau dihubungkan secara otomatis.
# 2. Jalankan perintah berikut di terminal:
#    docker compose up --build -d
#
# 3. Menghentikan Layanan:
#    docker compose down
# ==============================================================================
